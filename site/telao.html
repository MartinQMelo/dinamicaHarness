<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telão · Você é o agente</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="telao">
  <main>
    <h1>Você é o agente</h1>
    <p id="cronometro" class="cronometro telao-cronometro" hidden></p>

    <section id="telao-sem-sala" hidden>
      <p id="mensagem-telao-sem-sala">Abra o telão pelo link mostrado no controle.</p>
    </section>

    <section id="telao-lobby" class="telao-lobby" hidden>
      <div class="telao-entrada">
        <p class="telao-chamada">Entre pelo celular</p>
        <canvas id="qr-aluno" class="qr" width="400" height="400" role="img" aria-label="QR code para entrar na sala"></canvas>
        <p class="telao-link"><span id="link-telao"></span></p>
        <p class="telao-chamada">Sala <strong id="telao-codigo" class="telao-numero"></strong></p>
      </div>
      <div class="telao-placar">
        <p class="telao-contagem"><strong id="contagem-alunos" class="telao-numero">0</strong> <span id="rotulo-alunos">alunos</span></p>
        <p class="telao-contagem"><strong id="contagem-grupos" class="telao-numero">0</strong> <span id="rotulo-grupos">grupos</span></p>
        <ul id="lista-grupos" class="telao-grupos"></ul>
      </div>
    </section>

    <section id="telao-rodada" hidden>
      <h2 id="telao-rodada-titulo" class="telao-frase"></h2>
      <p id="telao-frase" class="telao-frase"></p>
      <ul id="telao-telas" class="telao-telas"></ul>
    </section>

    <section id="telao-avaliacao" class="telao-avaliacao" hidden>
      <h2 class="telao-frase">Rodada 1 · placar</h2>
      <div class="telao-avaliacao-colunas">
        <div class="telao-placar-r1">
          <p class="telao-media"><strong id="placar-r1-media" class="telao-numero-grande">0</strong>
            <span class="telao-media-de">de <span id="placar-r1-total" class="telao-numero">5</span></span></p>
          <p class="telao-chamada">critérios cumpridos, em média</p>
          <ul id="placar-r1-telas" class="telao-grupos"></ul>
        </div>
        <div class="telao-revelados">
          <p class="telao-chamada">Os critérios eram estes:</p>
          <ol id="telao-criterios" class="telao-criterios"></ol>
        </div>
      </div>
    </section>

    <section id="telao-outra-fase" hidden>
      <p>Fase: <strong id="telao-fase"></strong></p>
    </section>
  </main>
  <script type="module">
    import { acompanharConexao } from './js/conexao.js';
    import { iniciarTelao } from './js/telao.js';
    acompanharConexao();
    iniciarTelao();
  </script>
</body>
</html>
